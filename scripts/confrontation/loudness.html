<!doctype html>
<meta charset="utf-8">
<title>Confrontation loudness</title>
<script type="module">
// Loudness of the confrontation's recordings (dev only; run by loudness.mjs). For each file: its
// length, its sample peak and its integrated loudness after ITU BS.1770 (K-weighted, 400 ms blocks
// with 75% overlap, gated at -70 LUFS and then 10 LU under the ungated mean), from the decoded audio.
const FILES = [
  ...[1, 2, 3, 4, 5, 6, 7].map((i) => `aria/end-aria-${i}`),
  ...[1, 2, 3, 4, 5, 6, 7, 8].map((i) => `voss/end-voss-${i}`),
  // Scene B and the narration (level3/SceneB.js)
  'aria/end-aria-8',
  ...[9, 10, 11, 12, 13, 14].map((i) => `voss/end-voss-${i}`),
  ...[1, 2, 3, 4, 5].map((i) => `ending/end-narrator-${i}`), 'ending/end-narrator-curedementia', 'ending/the-end',
  // Scene C and its narration
  'aria/end-aria-11', 'aria/end-aria-12', 'aria/end-aria-13',
  ...[15, 16, 17, 18, 19, 20].map((i) => `voss/end-voss-${i}`),
  ...[6, 7, 8, 9, 10, 11].map((i) => `ending/end-narrator-${i}`), 'ending/end-walla-1',
  // Level 3's ARIA around the relay and the water lock (level3/RelayLock.js), and her earlier lines
  // there, to compare
  ...['l3-relay-1', 'l3-relay-2', 'l3-relay-3', 'l3-relay-4', 'l3-relay-5', 'l3-kraken-2', 'l3-works-1', 'l3-trench-1'].map((id) => `aria/${id}`),
  'voss/v-lock-land', 'voss/v-helmet-gasp'
];

async function kWeighted(buffer) {
  const ac = new OfflineAudioContext(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
  const src = ac.createBufferSource();
  src.buffer = buffer;
  // stage 1: the head's shelf (+4 dB above about 1.5 kHz); stage 2: the low cut (about 38 Hz)
  const shelf = ac.createBiquadFilter();
  shelf.type = 'highshelf';
  shelf.frequency.value = 1681;
  shelf.gain.value = 4;
  const hp = ac.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 38;
  hp.Q.value = 0.5;
  src.connect(shelf).connect(hp).connect(ac.destination);
  src.start();
  return ac.startRendering();
}

function lufs(k) {
  const rate = k.sampleRate, block = Math.round(rate * 0.4), hop = Math.round(rate * 0.1);
  const ch = [];
  for (let c = 0; c < k.numberOfChannels; c++) ch.push(k.getChannelData(c));
  const blocks = [];
  for (let s = 0; s + block <= k.length; s += hop) {
    let z = 0;
    for (const d of ch) {
      let sum = 0;
      for (let i = s; i < s + block; i++) sum += d[i] * d[i];
      z += sum / block;
    }
    blocks.push(z);
  }
  const L = (z) => -0.691 + 10 * Math.log10(z);
  const abs = blocks.filter((z) => L(z) > -70);
  if (!abs.length) return -Infinity;
  const mean = abs.reduce((a, b) => a + b, 0) / abs.length;
  const rel = abs.filter((z) => L(z) > L(mean) - 10);
  return L(rel.reduce((a, b) => a + b, 0) / rel.length);
}

// Where the speech starts and ends (s): the first and last 20 ms windows within 30 dB of the peak
function speech(buffer, peak) {
  const d = buffer.getChannelData(0), win = Math.round(buffer.sampleRate * 0.02);
  const floor = peak * Math.pow(10, -30 / 20);
  let first = -1, last = -1;
  for (let s = 0; s + win <= d.length; s += win) {
    let sum = 0;
    for (let i = s; i < s + win; i++) sum += d[i] * d[i];
    if (Math.sqrt(sum / win) * Math.SQRT2 > floor) { if (first < 0) first = s; last = s + win; }
  }
  return { speechFrom: +(Math.max(0, first) / buffer.sampleRate).toFixed(2), speechTo: +(last / buffer.sampleRate).toFixed(2) };
}

window.__measure = async () => {
  const ac = new AudioContext();
  const out = {};
  for (const f of FILES) {
    const r = await fetch(`/public/assets/audio/${f}.mp3`).catch(() => null) ;
    const r2 = r && r.ok ? r : await fetch(`/assets/audio/${f}.mp3`);
    if (!r2.ok) { out[f] = null; continue; }
    // (a missing file comes back as the dev server's page: it does not decode)
    const buffer = await ac.decodeAudioData(await r2.arrayBuffer()).catch(() => null);
    if (!buffer) { out[f] = null; continue; }
    let peak = 0;
    for (let c = 0; c < buffer.numberOfChannels; c++) for (const v of buffer.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
    out[f] = { seconds: +buffer.duration.toFixed(3), peakDb: +(20 * Math.log10(peak)).toFixed(1), lufs: +lufs(await kWeighted(buffer)).toFixed(1), ...speech(buffer, peak) };
  }
  return out;
};
// A file over time (for timing a scene's beats to the pauses in a take): the momentary loudness
// (400 ms, K-weighted) every 100 ms, and the pauses (no window within 30 dB of the peak for 0.25 s
// or more) inside the speech
window.__profile = async (f) => {
  const ac = new AudioContext();
  const r = await fetch(`/assets/audio/${f}.mp3`);
  const buffer = await ac.decodeAudioData(await r.arrayBuffer()).catch(() => null);
  if (!buffer) return null;
  const k = await kWeighted(buffer), d = k.getChannelData(0), rate = k.sampleRate;
  const block = Math.round(rate * 0.4), hop = Math.round(rate * 0.1), momentary = [];
  for (let s = 0; s + block <= d.length; s += hop) {
    let z = 0;
    for (let i = s; i < s + block; i++) z += d[i] * d[i];
    momentary.push(+(-0.691 + 10 * Math.log10(z / block + 1e-12)).toFixed(1));
  }
  const raw = buffer.getChannelData(0), win = Math.round(buffer.sampleRate * 0.02);
  let peak = 0;
  for (const v of raw) peak = Math.max(peak, Math.abs(v));
  const floor = peak * Math.pow(10, -30 / 20), on = [];
  for (let s = 0; s + win <= raw.length; s += win) {
    let sum = 0;
    for (let i = s; i < s + win; i++) sum += raw[i] * raw[i];
    on.push(Math.sqrt(sum / win) * Math.SQRT2 > floor);
  }
  const first = on.indexOf(true), last = on.lastIndexOf(true), pauses = [];
  for (let i = first, start = -1; i <= last; i++) {
    if (!on[i] && start < 0) start = i;
    if (on[i] && start >= 0) {
      if ((i - start) * 0.02 >= 0.25) pauses.push([+(start * 0.02).toFixed(2), +(i * 0.02).toFixed(2)]);
      start = -1;
    }
  }
  return { momentary, pauses };
};
window.__ready = true;
</script>
