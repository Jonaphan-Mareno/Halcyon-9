<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>halcyon-9</title>
    <!-- the opening cinematic plays first: no start screen flashes before it (?level= and ?nointro keep it) -->
    <style>html.cine #welcome-screen { display: none; } html.cine, html.cine body { background: #000; }</style>
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        if (!p.has('level') && !p.has('nointro')) document.documentElement.classList.add('cine');
      })();
    </script>
  </head>
  <body>
    <div id="ui-layer">
      <div id="welcome-screen">
        <div class="welcome-content" id="welcome-content" style="opacity: 0; transition: opacity 1s ease-in;">
          <h1>HALCYON-9</h1>
          <p>WARNING: THE SHIP IS SINKING</p>
          <button id="start-btn">WAKE UP</button>
        </div>
      </div>
      <div id="reticle"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
